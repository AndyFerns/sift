name: Bug report
description: Something in Sift is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.
        If the bug involves Sift deleting, or offering to delete, something it should not have,
        please say so clearly in the title. Security problems should go through SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what did Sift do instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command(s) you ran. A minimal directory layout that triggers it helps a lot.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      multiple: true
      options:
        - CLI
        - TUI
        - Web dashboard / API
        - Python API (sift.core)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sift version
      description: Output of `sift --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, filesystem and Python version
      placeholder: "Windows 11 / NTFS / Python 3.12.6"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or logs
      description: Paste any relevant output. Remove private paths if you need to.
      render: text
